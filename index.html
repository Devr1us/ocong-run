<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Run - Ocong</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas { display: block; }
    </style>
</head>
<body>

<script src="assets/js/phaser.min.js"></script>
<script src="sceneMenu.js"></script>
<script src="scenePlay.js"></script>

<script>
    // Variabel Global
    var LEFT        = 0;
    var CENTER      = 0;
    var RIGHT       = 0;
    var TOP         = 0;
    var MIDDLE      = 0;
    var BOTTOM      = 0;

    // Global sound
    var snd_ambience = null;

    var config = {
        type: Phaser.AUTO,
        width: 1366,
        height: 768,
        backgroundColor: '#87CEEB',
        physics: {
            default: 'arcade',
            arcade: {
                gravity: { y: 0 },
                debug: false
            }
        },
        scene: [SceneMenu, ScenePlay]
    };

    var game = new Phaser.Game(config);
</script>

</body>
</html>
